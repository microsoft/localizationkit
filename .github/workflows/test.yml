name: Test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -

      - name: Install dependencies
        run: poetry install

      - name: Format Check (Black)
        run: poetry run black -l 100 --check localizationkit/*.py

      - name: Lint
        run: |
          poetry run pylint --rcfile=pylintrc localizationkit
          poetry run pylint --rcfile=pylintrc tests

      - name: Type Check
        run: |
          poetry run mypy --ignore-missing-imports localizationkit/
          poetry run mypy --ignore-missing-imports tests/

      - name: pytest
        run: poetry run pytest tests --cov=localizationkit --cov-report xml --doctest-modules --junitxml=junit/test-results.xml

  # Single stable gate for branch protection required status checks.
  test-result:
    name: test-result
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Verify all matrix jobs passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "One or more test matrix jobs failed."
            exit 1
          fi
          echo "All test matrix jobs passed."
